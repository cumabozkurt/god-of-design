<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="t d">
  <title id="t">God of Design</title>
  <desc id="d">Project banner: the title God of Design next to eight tiles showing design traditions: Bauhaus, Islamic girih star, Swiss grid, Ottoman İznik tulip, Art Deco sunburst, wabi-sabi ensō, Kente cloth and Memphis.</desc>
  <defs>
    <clipPath id="c"><rect width="130" height="130" rx="6"/></clipPath>
    <pattern id="grid" width="13" height="13" patternUnits="userSpaceOnUse"><path d="M13 0H0V13" fill="none" stroke="#141414" stroke-opacity=".12" stroke-width="1"/></pattern>
  </defs>
  <rect width="1280" height="400" fill="#F4EFE6"/>
  <rect x="0" y="0" width="12" height="400" fill="#C8102E"/>

  <g font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" fill="#141414">
    <text x="64" y="118" font-size="15" letter-spacing="3.5" font-weight="700" fill="#C8102E">AGENT SKILLS · 109 STYLES · EVERY MEDIUM</text>
    <text x="60" y="214" font-family="Georgia, 'Times New Roman', serif" font-size="92" font-weight="700" letter-spacing="-2">God of Design</text>
    <text x="64" y="262" font-size="21">Design intelligence for AI coding agents:</text>
    <text x="64" y="292" font-size="21">Bauhaus to İznik, posters to pixels.</text>
    <text x="64" y="338" font-size="13" letter-spacing="1" fill="#5A544B">CLAUDE CODE · CODEX · OPENCODE · ANTIGRAVITY · CURSOR · ANY LLM</text>
  </g>

  <g font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1">
    <!-- 1 Bauhaus -->
    <g transform="translate(676 64)"><g clip-path="url(#c)">
      <rect width="130" height="130" fill="#E9E2D3"/>
      <circle cx="44" cy="46" r="28" fill="#C8102E"/>
      <rect x="66" y="22" width="44" height="44" fill="#1F4E9C"/>
      <path d="M22 108 L60 64 L98 108 Z" fill="#F2B705"/>
    </g><text x="10" y="124" fill="#141414">BAUHAUS</text></g>
    <!-- 2 Girih -->
    <g transform="translate(818 64)"><g clip-path="url(#c)">
      <rect width="130" height="130" fill="#1F4E9C"/>
      <g transform="translate(65 58)" fill="none" stroke="#E8C66A" stroke-width="3">
        <rect x="-30" y="-30" width="60" height="60"/>
        <rect x="-30" y="-30" width="60" height="60" transform="rotate(45)"/>
        <circle r="13" stroke="#F4EFE6" stroke-width="2"/>
      </g>
    </g><text x="10" y="124" fill="#F4EFE6">GIRIH</text></g>
    <!-- 3 Swiss -->
    <g transform="translate(960 64)"><g clip-path="url(#c)">
      <rect width="130" height="130" fill="#FFFFFF"/>
      <rect width="130" height="130" fill="url(#grid)"/>
      <rect x="13" y="13" width="52" height="52" fill="#C8102E"/>
      <rect x="78" y="13" width="39" height="6" fill="#141414"/>
      <rect x="78" y="26" width="26" height="6" fill="#141414"/>
      <rect x="13" y="78" width="104" height="10" fill="#141414"/>
      <rect x="13" y="94" width="65" height="4" fill="#141414"/>
    </g><text x="10" y="124" fill="#141414">SWISS</text></g>
    <!-- 4 Iznik tulip -->
    <g transform="translate(1102 64)"><g clip-path="url(#c)">
      <rect width="130" height="130" fill="#F7F3EA"/>
      <path d="M65 100 C64 84 66 72 65 62" stroke="#0E6B5C" stroke-width="4" fill="none"/>
      <path d="M65 92 C50 88 40 76 38 62 C52 66 60 76 65 92 Z" fill="#0E6B5C"/>
      <path d="M65 86 C80 82 90 72 94 58 C80 62 70 72 65 86 Z" fill="#1F4E9C"/>
      <path d="M65 64 C52 60 46 44 50 24 C56 34 60 40 65 42 C70 40 74 34 80 24 C84 44 78 60 65 64 Z" fill="#C8102E"/>
      <path d="M65 42 C62 32 63 22 65 14 C67 22 68 32 65 42 Z" fill="#C8102E"/>
    </g><text x="10" y="124" fill="#1F4E9C">İZNIK</text></g>
    <!-- 5 Art Deco -->
    <g transform="translate(676 206)"><g clip-path="url(#c)">
      <rect width="130" height="130" fill="#141414"/>
      <g stroke="#C9A24A" stroke-width="2.5">
        <path d="M65 112 L65 20 M65 112 L25 24 M65 112 L105 24 M65 112 L4 48 M65 112 L126 48 M65 112 L0 84 M65 112 L130 84"/>
      </g>
      <path d="M35 112 A30 30 0 0 1 95 112 Z" fill="#C9A24A"/>
    </g><text x="10" y="124" fill="#F4EFE6">ART DECO</text></g>
    <!-- 6 Wabi-sabi enso -->
    <g transform="translate(818 206)"><g clip-path="url(#c)">
      <rect width="130" height="130" fill="#E6DFD0"/>
      <circle cx="65" cy="58" r="34" fill="none" stroke="#2B2B2B" stroke-width="11" stroke-linecap="round" stroke-dasharray="190 24" transform="rotate(-70 65 58)" opacity=".88"/>
    </g><text x="10" y="124" fill="#2B2B2B">WABI-SABI</text></g>
    <!-- 7 Kente -->
    <g transform="translate(960 206)"><g clip-path="url(#c)">
      <rect width="130" height="130" fill="#F2B705"/>
      <rect x="0" y="0" width="130" height="14" fill="#0B7A3B"/><rect x="0" y="40" width="130" height="10" fill="#141414"/>
      <rect x="0" y="76" width="130" height="14" fill="#0B7A3B"/>
      <g fill="#C8102E"><rect x="10" y="18" width="18" height="18"/><rect x="56" y="18" width="18" height="18"/><rect x="102" y="18" width="18" height="18"/>
      <rect x="33" y="54" width="18" height="18"/><rect x="79" y="54" width="18" height="18"/></g>
      <g fill="#141414"><rect x="33" y="18" width="18" height="18"/><rect x="79" y="18" width="18" height="18"/></g>
    </g><text x="10" y="124" fill="#141414">KENTE</text></g>
    <!-- 8 Memphis -->
    <g transform="translate(1102 206)"><g clip-path="url(#c)">
      <rect width="130" height="130" fill="#FFE9F2"/>
      <path d="M12 40 q10 -16 20 0 t20 0 t20 0 t20 0 t20 0" fill="none" stroke="#1B9AAA" stroke-width="6" stroke-linecap="round"/>
      <path d="M78 58 L112 102 L70 98 Z" fill="#FF4F9A"/>
      <circle cx="38" cy="80" r="16" fill="#F2B705"/>
      <g fill="#141414"><circle cx="20" cy="14" r="2.5"/><circle cx="34" cy="14" r="2.5"/><circle cx="48" cy="14" r="2.5"/><circle cx="62" cy="14" r="2.5"/></g>
    </g><text x="10" y="124" fill="#141414">MEMPHIS</text></g>
  </g>
</svg>
